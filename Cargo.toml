[package]
name = "rusty"
version = "1.0.0"
edition = "2021"
description = "A fast, friendly terminal code editor written in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/codingsushi79/rusty"
default-run = "rusty"

[[bin]]
name = "rusty"
path = "src/main.rs"

[dependencies]
# Terminal UI.
ratatui = "0.29"
crossterm = "0.28"

# Syntax highlighting.
syntect = "5"

# Git integration.
git2 = "0.19"

# Paths & errors.
dirs = "5"
anyhow = "1"
arboard = { version = "3", default-features = false }
serde_json = "1"
similar = "2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
portable-pty = "0.8"
vt100 = "0.15"
ureq = "2"
wasmi = "0.31"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
